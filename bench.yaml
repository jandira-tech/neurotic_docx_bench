# neurotic-docx-bench — sequential multi-tool config.
# The docx are rendered by `renderer`: auto = Microsoft Word through
# scripts/word_pdf.py where this machine has Word, LibreOffice 26.2.4.2 where it
# does not (BENCH_RENDERER=word|soffice pins it). The oracle is always a render
# by that same program: a Word render is scored against the Word PDFs in
# corpus/word, a LibreOffice render against the LibreOffice renders of the same
# Word docx in corpus/libreoffice (same <state>/pdf/<stem>.pdf layout, mapped in
# corpus/libreoffice/word_map.csv). Either way the score isolates redline-markup
# fidelity vs Word rather than renderer drift.
renderer: auto
oracle_roots:
  word: corpus/word
  soffice: corpus/libreoffice
# Relative to the oracle root of the renderer in use. Every comparison of every
# pool is filed under the state of its docx; the pairs scored are the ones the
# corpora below generate.
source_of_truth: tracking_without_comments/pdf
extra_oracle_dirs:
  - with_comments_tracking/pdf
  - with_comments_clean/pdf
# docx-to-pdf and docxide-metrics read word_pdf, not source_of_truth.
# A pair is <state>/pdf/<stem>.pdf with <state>/docx/<stem>.docx.
# pdf_prior is an earlier Word render, not the oracle those commands score.
word_pdf:
  root: corpus/word
  states:
    - clean
    - tracking_without_comments
    - with_comments_clean
    - with_comments_tracking
# Sealed 40-pair holdout (overfitting detector): these keys are EXCLUDED from
# every normal scoring run and scored separately on demand with
# `bench run --holdout`; export surfaces the main-vs-holdout gap. The two sealed
# lists (word_based 20 + word_redlines_superdoc 20) as Word corpus keys, written
# by `bench corpus build`.
holdout_list: corpus/word/pools/holdout.txt
scoring:
  dpi: 144

# The corpus pools EVERY generating run is scored on: 227 + 196 + 399 = 822
# pairs, the rows of the pool tables `bench corpus build` writes. Declared once,
# here, because coverage used to be per-run copy-paste, and copy-paste does not
# propagate (8 of 12 runs once scored 207 pairs while 4 scored 803, all in one
# table). The driver expands a run's single `generate:` command once per entry
# below (config.expand_generate_commands), so a pool added here reaches every
# vendor at once. A run that genuinely applies to one pool says so with its own
# `corpora: [<name>]`; silence means ALL. Hardcoding --manifest/--source-dir in a
# `generate:` is rejected at load time.
corpora:
  - name: word_based
    manifest: corpus/word/pools/word_based_pairs.csv
    source_dir: corpus/word
  - name: word_based_randomized
    manifest: corpus/word/pools/word_based_randomized_pairs.csv
    source_dir: corpus/word
  - name: word_redlines_superdoc
    manifest: corpus/word/pools/word_redlines_superdoc_pairs.csv
    source_dir: corpus/word

# Accepted ground truth: Word's own Accept All on 400 of the pool comparisons
# (grok_run/wr0929/accept_reject_split.csv; the other 400 are Word's Reject All,
# corpus/word/reject_all). Filed as <pair key>.docx/.pdf by `bench corpus actions`.
# Used by `bench run --accept-compare`, which accepts each tool's freshly
# generated redlines and diffs them against this corpus, rendered by `renderer`.
accepted_ground_truth: corpus/word/accept_all/docx

# Visual-benchmark oracle PDF folders: what Word prints, whatever renderer the
# docx runs use, since a viewer is measured against Word.
visual_oracles:
  visual_rendering: corpus/word/clean/pdf
  visual_redlines: corpus/word/tracking_without_comments/pdf
  visual_accepted_changes: corpus/word/accept_all/pdf

# Standalone generation scripts, executed in order by `bench run --generate`.
# The accepted ground truth and the source PDFs are Word's, filed by
# `bench corpus build` / `bench corpus actions`; nothing here writes the corpus.
generate_scripts:
  - name: roundtrips-node
    command: "uv run bench corpus stage corpus/word/pools/word_based_accepted_word_renders.csv out/roundtrip_source && node scripts/generate-roundtrips.mjs --all --source-dir out/roundtrip_source/docx"
  - name: roundtrips-superdoc
    command: "uv run bench corpus stage corpus/word/pools/word_based_accepted_word_renders.csv out/roundtrip_source && uv run python scripts/generate-roundtrips-superdoc.py --source-dir out/roundtrip_source/docx"

# The documents the roundtrip benchmark re-serializes: Word's own accept-all of the
# word_based redlines (166), listed by `bench corpus build`, staged at run time.
roundtrip_list: corpus/word/pools/word_based_accepted_word_renders.csv

# Tool versions are PINNED to the ones we reviewed:
#   docxodus 9.8.0 · docx-redline-js = local TS migration (dist: sibling package)
#   @stll/folio-core 0.17.1 (generator) · @stll/folio-react 0.13.4 (viewer)
#   superdoc is THREE packages, pinned independently — never conflate them:
#     superdoc-sdk (PyPI) 2.15.0       → run `superdoc`            (python_package:)
#     @superdoc-dev/sdk (npm) 1.21.3   → run `superdoc-ts`         (package:)
#     superdoc (npm, the editor) 2.3.0 → runs `superdoc-playwright-*` (package:)
#   tests/test_superdoc_pins.py fails if any pin drifts from what is installed.
#   jubarte builds are content-hashed under dist/
# Do NOT bump to @latest without re-review — the pin keeps CI reproducible.

runs:
  - name: jubarte-final-native
    dist: dist/jubarte-final
    generate: "node --import tsx scripts/generate-native-redlines.ts --method=jubarte-native --dist=dist/jubarte-final --out=$RUN_DIR/docx --run-dir=$RUN_DIR --tool=jubarte-final-native"
    render: auto
    jobs: 12
    # Distinct vendor: this run and jubarte-final-lossless share the same dist
    # build (identical tool_version), so with vendor "jubarte" the two engines'
    # result lines are indistinguishable and the newer one shadows the other
    # in every per-vendor ranking. "jubarte" stays the lossless engine.
    vendor: jubarte-ast
    benchmarks: [accepted_changes, script_redlines, roundtrip]

  - name: jubarte-final-lossless
    dist: dist/jubarte-final
    generate: "node --import tsx scripts/generate-native-redlines.ts --method=jubarte-lossless --dist=dist/jubarte-final --out=$RUN_DIR/docx --run-dir=$RUN_DIR --tool=jubarte-final-lossless"
    render: auto
    jobs: 12
    # Leftover output from this pin wedges LibreOffice 26.2.5.2 for the full
    # 1200s default (then retries). Fail those docs as ITT 0 instead of
    # stalling the 763-doc run for hours.
    timeout: 180
    vendor: jubarte
    benchmarks: [accepted_changes, script_redlines, roundtrip]

  # (2) docxodus — WASM/.NET compareDocuments (JSv4/docxodus, MIT). npm-published, so its
  # version is npm-resolved and stamped into tool_version.
  #
  # This pin installs into (and is read back from) the REPO ROOT node_modules, while the
  # adapter imports the VENDORED utils/docxodus/node_modules tree. Bump all three together
  # — this pin, root package.json, and utils/docxodus/package.json — or the run records one
  # version and measures another. generate-native-redlines.test.ts enforces the agreement,
  # which is also why root package.json pins docxodus exactly rather than by ^range: a
  # caret would let `bun install` drift the recorded version away from this pin.
  #
  # 9.0.0 moved the UNNAMED default comparison engine from WmlComparer to DocxDiff. The
  # adapter now names the engine explicitly, so this bump changes the measured version
  # without also making the measured engine a side effect of it.
  - name: docxodus
    package: "docxodus@12.6.4"
    generate: "node --import tsx scripts/generate-native-redlines.ts --method=docxodus --out=$RUN_DIR/docx --run-dir=$RUN_DIR --tool=docxodus"
    render: auto
    jobs: 12
    vendor: docxodus
    # visual_* deliberately NOT here. This is a GENERATING run (render: auto);
    # the visual oracles belong to the dedicated docxodus-playwright-* runs, exactly
    # as folio and superdoc are arranged. docxodus was the only generating run
    # declaring them, which handed it three extra near-zero rows (visual_rendering
    # and visual_accepted_changes both scored n_docs=0) that no other generating
    # vendor carried -- including ours, whose runs declare only the three below.
    # A competitor-only wipeout produced by our config is not a measurement.
    benchmarks: [accepted_changes, script_redlines, roundtrip]

  # (2b) docxodus-playwright-* — render DOCX through react-docxodus-viewer via
  # Playwright. One run per visual_* oracle corpus (same pattern as folio-playwright-*).
  # Prefer the vendored tree under utils/ (demo/harness.html).
  #
  # Viewer stack is the published npm package (JS + WASM from the same tarball).
  # Mixing registry JS with a different local WASM stuck the engine on
  # "Loading document engine…". Pin, viewer dep, and public/wasm must agree.
  # Refresh WASM: see react-docxodus-viewer/README.bench.md
  # Playwright fail-fasts on window.__rdvError instead of timing out.
  - name: docxodus-playwright-rendering
    package: "docxodus@12.6.4"
    docx: corpus/word/clean/docx
    render: playwright
    jobs: 12
    vendor: docxodus
    benchmarks: [visual_rendering]
    harness: &docxodus-harness
      server: "cd src/neurotic_docx_bench/utils/docxodus/react-docxodus-viewer && npx vite --port 5174 --host 127.0.0.1"
      url: "http://127.0.0.1:5174/harness.html"
      file_input: "#fileInput"
      page_selector: "[data-page-number]"
      # Do NOT OR with mere presence of [data-page-number] — blank page chrome
      # would pass readiness while __rdvDocumentReady is still false.
      readiness_js: "window.__rdvDocumentReady === true"
      error_js: "window.__rdvError"
      content_js: "window.__rdvHasContent === true"
      reject_blank: true
      timeout_ms: 60000

  - name: docxodus-playwright-redlines
    package: "docxodus@12.6.4"
    docx: corpus/word/tracking_without_comments/docx
    render: playwright
    jobs: 12
    vendor: docxodus
    benchmarks: [visual_redlines]
    harness: *docxodus-harness

  - name: docxodus-playwright-accepted
    package: "docxodus@12.6.4"
    docx: corpus/word/accept_all/docx
    render: playwright
    jobs: 12
    vendor: docxodus
    benchmarks: [visual_accepted_changes]
    harness: *docxodus-harness

  # (2c) folio-playwright-* — three runs that render DIFFERENT DOCX corpora
  # through the @stll/folio-react web viewer (stella/folio, Apache-2.0) via
  # Playwright, each scoring against its own oracle. One run renders one docx
  # folder, so each visual_* benchmark needs its own run with the matching source.
  # Requires: cd harness/folio-viewer && bun install
  # The harness server is auto-started/stopped by `bench run`.
  # NOTE: the renderer reads DOCX via set_input_files (read-only upload) and
  # writes PDFs to the run dir — the source corpus is never mutated.
  - name: folio-playwright-rendering
    package: "@stll/folio-react@0.13.4"
    docx: corpus/word/clean/docx
    render: playwright
    jobs: 12
    vendor: folio
    benchmarks: [visual_rendering]
    harness: &folio-harness
      server: "cd harness/folio-viewer && npx vite --port 5175 --host 127.0.0.1"
      url: "http://127.0.0.1:5175/harness.html"
      file_input: "#fileInput"
      page_selector: ".layout-page"
      # No `|| .layout-page > 0` fallback: folio paginates incrementally, so the
      # first page appears long before the last one, and the fallback let
      # Playwright capture a partially paginated document. __folioReady is now set
      # by the harness only after the page count + text length hold steady (see
      # harness/folio-viewer/src/harness-main.ts:waitForStablePagination).
      readiness_js: "window.__folioReady === true"
      timeout_ms: 90000

  - name: folio-playwright-redlines
    package: "@stll/folio-react@0.13.4"
    docx: corpus/word/tracking_without_comments/docx
    render: playwright
    jobs: 12
    vendor: folio
    benchmarks: [visual_redlines]
    harness: *folio-harness

  - name: folio-playwright-accepted
    package: "@stll/folio-react@0.13.4"
    docx: corpus/word/accept_all/docx
    render: playwright
    jobs: 12
    vendor: folio
    benchmarks: [visual_accepted_changes]
    harness: *folio-harness

  # (3) docx-redline-js — OOXML text-reconciliation redliner (strict-TS migration).
  # Local build from sibling repo docx-redline-migration-kit (NOT npm 0.2.0).
  # Rebuild: cd ../docx-redline-migration-kit && bun run build:package
  # then: cd src/neurotic_docx_bench/utils/docx-redline-js && bun install
  - name: docx-redline-js
    dist: ../docx-redline-migration-kit/dist/docx-redline-js
    generate: "node --import tsx scripts/generate-native-redlines.ts --method=docx-redline-js --out=$RUN_DIR/docx --run-dir=$RUN_DIR --tool=docx-redline-js"
    render: auto
    jobs: 12
    vendor: docx-redline-js
    benchmarks: [script_redlines]

  # (3b) folio — @stll/folio-core generateRedlineDocx(base, next, {author}).
  # Since 0.13.0 folio ships a single base+next→redline call, so the loadEngine
  # 'folio' adapter is now a straight one-call passthrough (see
  # scripts/generate-native-redlines.ts) with no harness-side diff translation.
  # This run is NOT harness-assisted: the scored bytes are folio's own output.
  # Before 0.15.13 we composed compareDocxVersions + FolioDocxReviewer
  # .applyOperations ourselves, and that composition mis-read a `modified` diff
  # entry's revised-side blockId as a base-side id — every modification op was
  # dropped and modification-only pairs scored as "no redline". Those older
  # folio numbers measured our translation, not folio.
  - name: folio
    package: "@stll/folio-core@0.17.1"
    generate: "node --import tsx scripts/generate-native-redlines.ts --method=folio --out=$RUN_DIR/docx --run-dir=$RUN_DIR --tool=folio"
    render: auto
    jobs: 12
    vendor: folio
    benchmarks: [script_redlines, accepted_changes, roundtrip]

  # (4) superdoc — Python SuperDoc SDK (superdoc-sdk), Document Engine diff
  # capture→compare→apply(tracked)→save. This is the *generator* pin: 2.15.0
  # (2026-09-26). The 1.19.2 → 2.0.0 notes below are historical.
  # The *editor* used for visual_* is a separate package — see superdoc-playwright-*.
  # 1.19.2 → 2.0.0 is a major bump upstream, but the diff surface superdoc_gen drives
  # (superdoc/generated/client.py _AsyncBoundDocDiffApi.capture/compare/apply) is
  # byte-identical between the two; what moves is the bundled CLI engine
  # (superdoc-sdk-cli-<platform>==2.0.0, a PEP 508 companion dependency).
  #
  # COVERAGE REGRESSION, measured A/B on the same first 25 pairs of
  # corpus/word_based/centralized_mapping.csv: 1.19.2 generated 25/25, 2.0.0
  # generates 20/25. The 5 losses are deliberate engine-side refusals in 2.0.0,
  # not adapter bugs — it declines rather than emit markup it cannot author:
  #   - SOURCE_NOT_COMPLETE "synchronous compare capture requires a terminal
  #     source-complete posture" (e.g. alternate_content.docx — permanent, not a
  #     race: it still fails after 6 retries). The engine's async capture path
  #     takes an `allowIncompleteSource` escape hatch, but doc.diff.capture
  #     declares only {doc, sessionId}, so the SDK cannot reach it.
  #   - diff.apply refusing families it defers this release ("tracked-changes",
  #     "header-footer-parts") — sources that already carry tracked changes.
  # These land in generate_failures.json and are scored as misses, which is the
  # honest reading: the vendor's current release cannot redline those pairs.
  # 2.15.0 on the Word-truth pools (803 pairs, 744 with a Word reference) refuses
  # most pairs (header/footer topology, shared definitions, numbering replay):
  # 648 of 744 score zero.
  - name: superdoc
    python_package: "superdoc-sdk==2.15.0" # installed version → tool_version
    generate: "uv run python -m neurotic_docx_bench.superdoc_gen --out=$RUN_DIR/docx --tool=superdoc"
    render: auto
    jobs: 12
    vendor: superdoc
    benchmarks: [accepted_changes, script_redlines, roundtrip]

  # (4e) redlines — houfu/redlines pure-text differ (MIT). Extracts paragraph text
  # from base/next DOCX, runs Redlines with required nupunkt==0.6.0 (NupunktProcessor),
  # writes a new DOCX with w:ins/w:del. Text-level baseline only — no OOXML
  # structure fidelity. nupunkt is a first-class pin, not an optional extra.
  - name: redlines
    python_package: "redlines==0.6.1"
    generate: "uv run python -m neurotic_docx_bench.redlines_gen --out=$RUN_DIR/docx --tool=redlines"
    render: auto
    jobs: 12
    vendor: redlines
    benchmarks: [script_redlines]

  # (4e2) superdoc-redlines — yuch85/superdoc-redlines (Apache-2.0), SuperDoc headless
  # CLI: https://github.com/yuch85/superdoc-redlines. The CLI applies block-ID edits
  # with track changes (word-level diff per block); it has no base+next compare, so
  # superdoc_redlines_gen.py supplies a deterministic block alignment and drives the
  # CLI's own extract→apply pipeline. Requires a fresh clone + `npm install` at repo
  # root `superdoc-redlines/` (gitignored; see AGENTS.md "Adding a tool").
  # Version = the clone's package.json version.
  - name: superdoc-redlines
    dist: superdoc-redlines
    generate: "uv run python -m neurotic_docx_bench.superdoc_redlines_gen --out=$RUN_DIR/docx --tool=superdoc-redlines --repo=superdoc-redlines"
    render: auto
    jobs: 12
    vendor: superdoc-redlines
    benchmarks: [script_redlines]

  # (4f) jubarte-rust — canonical ~/T/jubarte-redlines CLI (Rust Word-mode comparer).
  # Install target/release/jubarte as utils/jubarte/jubarte-rust/redline; see
  # ../reconciliation_plan/GET_JUBARTE_RUST.md for the source-to-bench map.
  - name: jubarte-rust
    dist: src/neurotic_docx_bench/utils/jubarte/jubarte-rust
    generate: "node --import tsx scripts/generate-native-redlines.ts --method=jubarte-rust --dist=src/neurotic_docx_bench/utils/jubarte/jubarte-rust --out=$RUN_DIR/docx --run-dir=$RUN_DIR --tool=jubarte-rust"
    render: auto
    jobs: 12
    vendor: jubarte-rust
    benchmarks: [script_redlines, accepted_changes, roundtrip]

  # (4g) jubarte-wasm — wasm-bindgen adapter over the same canonical Rust source.
  # Rebuild from utils/jubarte/jubarte-wasm; script_redlines must match native
  # per-document scores before publishing a WASM speed claim.
  - name: jubarte-wasm
    dist: src/neurotic_docx_bench/utils/jubarte/jubarte-wasm/pkg
    generate: "node --import tsx scripts/generate-native-redlines.ts --method=jubarte-wasm --dist=src/neurotic_docx_bench/utils/jubarte/jubarte-wasm/pkg --out=$RUN_DIR/docx --run-dir=$RUN_DIR --tool=jubarte-wasm"
    render: auto
    jobs: 12
    vendor: jubarte-wasm
    benchmarks: [script_redlines]


  # (4b) superdoc via the TypeScript SDK (@superdoc-dev/sdk) — same Document Engine
  # family as the Python SDK, JS runtime. Pinned independently of superdoc-sdk
  # (see the three-package note at the top).
  - name: superdoc-ts
    package: "@superdoc-dev/sdk@1.21.3" # npm-resolved → tool_version
    generate: "node --import tsx scripts/generate-native-redlines.ts --method=superdoc-ts --out=$RUN_DIR/docx --run-dir=$RUN_DIR --tool=superdoc-ts"
    render: auto
    jobs: 12
    vendor: superdoc
    benchmarks: [script_redlines]

  # (4c) superdoc-native — SuperDoc's OWN in-process engine
  # (Editor.commands.compareDocuments + replayDifferences), run through SuperDoc's own
  # Vite/vitest toolchain (packages/super-editor needs its Vite path aliases + happy-dom),
  # not the npm SDK. Requires a fresh `git clone https://github.com/Harbour-Enterprises/
  # SuperDoc.git superdoc/` + `pnpm install` at repo root (gitignored, too large to commit;
  # see AGENTS.md "Adding a tool"). `dist` points at packages/super-editor (has its own
  # package.json version) rather than the whole monorepo, so version resolution doesn't
  # hash node_modules.
  - name: superdoc-native
    dist: superdoc/packages/super-editor
    generate: "node --import tsx scripts/generate-native-redlines.ts --method=superdoc-native --out=$RUN_DIR/docx --run-dir=$RUN_DIR --tool=superdoc-native"
    render: auto
    jobs: 12
    vendor: superdoc
    benchmarks: [script_redlines]

  # (4d) superdoc-playwright-* — render DOCX through the SuperDoc *editor* (npm package
  # `superdoc@1.44.1`, NOT the Python/TS SDK 1.19.2). Same pattern as folio-playwright-*:
  # one run per visual_* oracle corpus. Harness lives under utils/superdoc.
  - name: superdoc-playwright-rendering
    package: "superdoc@2.18.0"
    docx: corpus/word/clean/docx
    render: playwright
    jobs: 12
    vendor: superdoc
    benchmarks: [visual_rendering]
    harness: &superdoc-harness
      server: "cd src/neurotic_docx_bench/utils/superdoc && npx vite --port 9106 --host 127.0.0.1 --strictPort"
      url: "http://127.0.0.1:9106/"
      file_input: "#fileInput"
      page_selector: ".superdoc-page"
      readiness_js: "window.__superdocReady === true && window.__superdocLayoutStable === true && window.__superdocFontsReady === true"
      timeout_ms: 90000

  - name: superdoc-playwright-redlines
    package: "superdoc@2.18.0"
    docx: corpus/word/tracking_without_comments/docx
    render: playwright
    jobs: 12
    vendor: superdoc
    benchmarks: [visual_redlines]
    harness: *superdoc-harness

  - name: superdoc-playwright-accepted
    package: "superdoc@2.18.0"
    docx: corpus/word/accept_all/docx
    render: playwright
    jobs: 12
    vendor: superdoc
    benchmarks: [visual_accepted_changes]
    harness: *superdoc-harness

  # (5) stemma — stemma-cli 0.5.0 `stemma compare` (stemma-sh/stemma, MIT OR Apache-2.0).
  # Dist is the release binary from the v0.5.0 tag (crates.io stemma-cli 0.5.0).
  # create-new only: the CLI refuses an existing -o; the adapter always writes a
  # fresh temp dest. Packages missing word/_rels/document.xml.rels fail loud and
  # land in generate_failures.json — they are not dropped from the corpus.
  # No visual_*: stemma is not a layout/browser editor.
  - name: stemma
    dist: src/neurotic_docx_bench/utils/stemma
    generate: "node --import tsx scripts/generate-native-redlines.ts --method=stemma --dist=src/neurotic_docx_bench/utils/stemma --out=$RUN_DIR/docx --run-dir=$RUN_DIR --tool=stemma"
    render: auto
    jobs: 12
    vendor: stemma
    benchmarks: [script_redlines, accepted_changes, roundtrip]

  # (6) safe-docx-compare — UseJunior/safe-docx `@usejunior/docx-compare`
  # compareDocuments at merge 7bd35c876493f2725b095f0190c28d2644962c78 of PR 854.
  # Dist pin (not package:) because package: cannot express a git SHA, and the
  # published npm `@usejunior/docx-compare@0.19.1` tarball is 2026-07-24 and
  # predates PR 854 (retracted field-husk engine). ENGINE_COMMIT.txt records
  # 7bd35c8; tool_version hashes the executed bytes.
  # No visual_*: safe-docx is not a layout/browser editor.
  - name: safe-docx-compare
    dist: src/neurotic_docx_bench/utils/safe-docx-compare
    generate: "node --import tsx scripts/generate-native-redlines.ts --method=safe-docx --dist=src/neurotic_docx_bench/utils/safe-docx-compare --out=$RUN_DIR/docx --run-dir=$RUN_DIR --tool=safe-docx-compare"
    render: auto
    jobs: 12
    vendor: safe-docx
    benchmarks: [script_redlines, accepted_changes, roundtrip]

  # Sanity/self-fidelity baseline: render the Word redline DOCX via LibreOffice and score
  # against the same redline as Word rendered it (identity ⇒ 100; validates the pipeline).
  # - name: word-redlines-soffice
  #  render: soffice
  # docx: corpus/word/tracking_without_comments/docx
  #  jobs: 12
