<svg xmlns="http://www.w3.org/2000/svg" width="290" height="28" viewBox="0 0 290 28" role="img" aria-label="chill → neurotic_docx_bench | BENCHED!">
  <title>chill → neurotic_docx_bench | BENCHED!</title>
  <rect x="0.5" y="0.5" width="289" height="27" rx="4" fill="#fffdf9" stroke="#d6d3d1" stroke-width="1"/>
  <!-- Left Word revision change bar -->
  <rect x="5.5" y="4.5" width="2.5" height="19" rx="1.25" fill="#dc2626"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">
    <!-- <redline>chill</redline> (5 chars * 6.8 = 34.0px, x=15..49.0) -->
    <text x="15" y="15.5" fill="#dc2626" textLength="34.0" lengthAdjust="spacing">chill</text>
    <line x1="14" y1="11.8" x2="50.0" y2="11.8" stroke="#dc2626" stroke-width="1.4"/>
    <!-- <insertion_double_underline_blue>neurotic</insertion_double_underline_blue> (8 chars * 6.8 = 54.4px, x=51.5..105.9) -->
    <text x="51.5" y="15.5" fill="#0070c0" font-weight="600" textLength="54.4" lengthAdjust="spacing">neurotic</text>
    <line x1="51.5" y1="18.0" x2="105.9" y2="18.0" stroke="#0070c0" stroke-width="1.15"/>
    <line x1="51.5" y1="20.0" x2="105.9" y2="20.0" stroke="#0070c0" stroke-width="1.15"/>
    <!-- _docx_bench (11 chars * 6.8 = 74.8px, x=107.4..182.2) -->
    <text x="107.4" y="15.5" fill="#1e293b" font-weight="600" textLength="74.8" lengthAdjust="spacing">_docx_bench</text>
  </g>
  <!-- Divider -->
  <line x1="194" y1="4.5" x2="194" y2="23.5" stroke="#e7e5e4" stroke-width="1"/>
  <!-- Right pill: <insertion_double_underline_blue_bold>BENCHED!</insertion_double_underline_blue_bold> -->
  <rect x="200" y="4" width="84" height="20" rx="3" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="700">
    <text x="214.8" y="15.5" fill="#0070c0" textLength="54.4" lengthAdjust="spacing">BENCHED!</text>
    <line x1="214.8" y1="18.0" x2="269.2" y2="18.0" stroke="#0070c0" stroke-width="1.25"/>
    <line x1="214.8" y1="20.1" x2="269.2" y2="20.1" stroke="#0070c0" stroke-width="1.25"/>
  </g>
</svg>
