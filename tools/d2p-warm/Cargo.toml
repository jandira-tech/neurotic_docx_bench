[package]
name = "d2p-warm"
version = "0.1.0"
edition = "2024"
publish = false
description = "Warm docx->pdf worker: one long-lived process per tool for scripts/docx_to_pdf_speed.py --warm"

# One tool per build (`--features <tool>`): built together, cargo unifies
# fontdb's memmap feature into rdocx's layout crate, which then fails to
# compile, and each tool's own CLI never links the others anyway.
[features]
jubarte = ["dep:jubarte-redlines"]
docxide = ["dep:docxide-pdf"]
rdocx = ["dep:rdocx"]
office2pdf = ["dep:office2pdf"]

[dependencies]
# The same library versions the cold run's CLIs are built from.
docxide-pdf = { version = "=0.17.1", default-features = false, optional = true }
office2pdf = { version = "=0.7.0", optional = true }
rdocx = { version = "=0.14.0", features = ["system-fonts"], optional = true }
# Built from the canonical checkout, never a copied binary.
jubarte-redlines = { path = "../../../jubarte-redlines", optional = true }

[profile.release]
debug = false
