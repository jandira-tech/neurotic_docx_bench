# The service is not an installed package: Windows runs serve.py from the
# checkout with requirements.txt (pywin32 and the vendored purexml wheel)
# installed into its interpreter. This file only pins the dev tools that
# scripts/generate-openapi.py and the type checker use.
[project]
name = "word-endpoint"
version = "0.1.0"
description = "Microsoft Word compare and PDF export behind an HTTP API (Windows)"
readme = "README.md"
requires-python = ">=3.15"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    "apispec>=6.10.1",
    "openapi-spec-validator>=0.9.0",
    "pyrefly>=1.4.1",
]
