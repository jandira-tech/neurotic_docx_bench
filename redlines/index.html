<!doctype html>
<meta charset="utf-8">
<title>Redlines vs Microsoft Word: jubarte, docxodus, SuperDoc</title>
<style>
:root { --bg:#1e1e1e; --panel:#252526; --fg:#ddd; --muted:#888; --accent:#4ea1ff; --border:#3a3a3a; }
* { box-sizing:border-box; }
body { margin:0; font:13px/1.4 -apple-system, Helvetica, Arial, sans-serif; background:var(--bg); color:var(--fg); display:grid; grid-template-columns:280px 1fr; grid-template-rows:auto auto 1fr; height:100vh; }
#legend { grid-column:1/3; padding:3px 10px 5px; font-size:11px; line-height:1.5; color:var(--muted); background:var(--panel); border-bottom:1px solid var(--border); }
#legend b { color:var(--fg); }
#legend span { margin-right:14px; }
#bar { grid-column:1/3; display:flex; gap:14px; align-items:center; padding:6px 10px; background:var(--panel); border-bottom:1px solid var(--border); flex-wrap:wrap; }
#bar label { display:inline-flex; align-items:center; gap:4px; cursor:pointer; user-select:none; }
#bar .grp { display:inline-flex; gap:8px; align-items:center; padding-right:14px; border-right:1px solid var(--border); }
#bar button, #bar select, #bar input[type=text] { background:#333; color:var(--fg); border:1px solid #555; border-radius:3px; padding:2px 8px; font:inherit; }
#bar button:hover { background:#444; }
kbd { background:#333; border:1px solid #555; border-radius:3px; padding:0 4px; font-size:11px; color:var(--muted); }
.ver { color:var(--muted); font-weight:400; font-size:11px; }
#side { overflow:auto; background:var(--panel); border-right:1px solid var(--border); }
#side input { width:100%; padding:6px 8px; background:#333; color:var(--fg); border:0; border-bottom:1px solid var(--border); font:inherit; position:sticky; top:0; }
#side .case { padding:4px 8px; cursor:pointer; border-bottom:1px solid #2e2e2e; display:grid; grid-template-columns:1fr auto; gap:0 8px; align-items:baseline; }
#side .case:hover { background:#2c2c2c; }
#side .case.sel { background:#094771; }
#side .name { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#side .grp { color:var(--muted); font-size:11px; }
#main { overflow:auto; padding:10px; }
#grid { display:grid; gap:4px 10px; align-items:start; }
.col { min-width:0; }
.colhead { margin:0; min-width:0; font-size:12px; font-weight:600; color:var(--muted); position:sticky; top:0; background:var(--bg); padding:2px 0; z-index:1; }
.colhead b { color:var(--fg); }
.page { margin-bottom:8px; }
.page img { width:100%; display:block; background:#fff; box-shadow:0 0 0 1px #000; }
.missing { width:100%; aspect-ratio:8.5/11; display:flex; align-items:center; justify-content:center; color:var(--muted); background:#2a2a2a; border:1px dashed #444; }
#overlay { position:relative; }
#overlay img { width:100%; display:block; }
#overlay img.top { position:absolute; inset:0; }
#scores table { border-collapse:collapse; font-size:12px; white-space:nowrap; }
#scores th, #scores td { padding:3px 9px; border-bottom:1px solid #2e2e2e; text-align:left; }
#scores th { color:var(--muted); font-weight:600; cursor:pointer; user-select:none; background:var(--panel); }
#scores th.eng { text-align:center; border-left:1px solid var(--border); cursor:default; }
#scores th.sorted { color:var(--fg); }
#scores td.num, #scores th.num { text-align:right; font-variant-numeric:tabular-nums; }
#scores td.first { border-left:1px solid var(--border); }
#scores td.best { color:#7ee787; }
#scores tr.mean td { color:var(--fg); font-weight:600; background:#2a2a2a; }
#scores tbody tr { cursor:pointer; }
#scores tbody tr:hover { background:#2c2c2c; }
#scores tbody tr.sel { background:#094771; }
#scores .note { color:var(--muted); font-size:11px; margin:8px 0 14px; }
.hidden { display:none !important; }
#more { display:block; margin:4px 0 24px; padding:8px 18px; background:#333; color:var(--fg); border:1px solid #555; border-radius:4px; font:inherit; cursor:pointer; }
#more:hover { background:#444; }
/* viewer-features v2 */
#bar select#mode { font-weight:600; }
#sidehead { position:sticky; top:0; z-index:2; background:var(--panel); border-bottom:1px solid var(--border); }
#sidehead #filter { position:static; }
#fx { display:grid; grid-template-columns:auto minmax(0, 1fr); gap:4px 6px; padding:6px 8px; font-size:12px; align-items:center; }
#fx label { color:var(--muted); }
#fx select, #fx input, #fx button { background:#333; color:var(--fg); border:1px solid #555; border-radius:3px; padding:1px 4px; font:inherit; width:auto; position:static; }
#fx .row { display:flex; gap:4px; align-items:center; flex-wrap:wrap; min-width:0; }
#fx select { max-width:100%; min-width:0; }
#fx input[type=number] { width:4.5em; }
#fx .foot { grid-column:1/3; display:flex; gap:6px; align-items:center; flex-wrap:wrap; padding-right:4px; }
#fx .foot #fxn { color:var(--muted); margin-right:auto; }
#fx button:hover { background:#444; }
#list .case { scroll-margin-top:var(--headh, 0px); }
body.noside { grid-template-columns:0 1fr; }
body.noside #side { display:none; }
body.noside #main { grid-column:1/3; }
#nav { gap:4px; }
#nav #navPos { color:var(--muted); font-size:11px; min-width:6.5em; text-align:center; font-variant-numeric:tabular-nums; }
#sideToggle { font-size:14px; line-height:1; padding:2px 7px; }
body.noside #sideToggle { background:#094771; border-color:var(--accent); }
#engines .ver { display:none; }
#legend { padding:0; }
#legend summary { list-style:none; cursor:pointer; user-select:none; }
#legend summary::-webkit-details-marker { display:none; }
#legend .chev { display:inline-block; transition:transform .18s ease; color:var(--accent); }
#legend details[open] > summary .chev { transform:rotate(90deg); }
#legend .about > summary { display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; padding:3px 10px; }
#legend .about > summary .ttl { color:var(--fg); font-weight:600; }
#legend .about > summary .hint { color:var(--muted); }
#legend .about > summary a, #legend .pill { display:inline-block; padding:0 9px; border:1px solid var(--border); border-radius:999px; background:#2d2d30; color:var(--accent); text-decoration:none; }
#legend .about > summary a:hover { background:#34343a; }
#legend .items { display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); gap:6px; padding:2px 10px 8px; align-items:start; }
#legend .item { border:1px solid var(--border); border-radius:10px; background:#2a2a2d; overflow:hidden; }
#legend .item > summary { padding:4px 10px; color:var(--fg); display:flex; gap:7px; align-items:baseline; }
#legend .item > summary:hover { background:#313136; }
#legend .item > summary .dot { width:8px; height:8px; border-radius:50%; flex:none; align-self:center; }
#legend .item > summary .sub { color:var(--muted); font-weight:400; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#legend .item > div { padding:2px 12px 8px 25px; color:#bbb; }
</style>
<div id="bar">
  <span class="grp"><select id="mode" autocomplete="off" title="what to compare"><option value="../">Convert DOCX → PDF</option><option value="./" selected>Compare (redline) two documents</option></select></span>
  <span class="grp" id="nav"><button id="sideToggle" title="hide / show the case list (s)">&#9776;</button><button id="navPrev" title="previous case (&uarr;)">&lsaquo; prev</button><button id="navRand" title="random case (r)">random</button><button id="navNext" title="next case (&darr;)">next &rsaquo;</button><span id="navPos"></span></span>
  <span class="grp" id="engines"></span>
  <span class="grp">
    <span id="pageinfo"></span>
  </span>
  <span class="grp"><label>zoom <input type="range" id="zoom" min="200" max="1400" value="600" step="20"></label></span>
  <span class="grp">
    <label><input type="checkbox" id="ovl"> overlay</label>
    <select id="ovlA"></select> under <select id="ovlB"></select>
    <select id="blend"><option value="normal">opacity</option><option value="difference">difference</option><option value="multiply">multiply</option></select>
    <input type="range" id="alpha" min="0" max="100" value="50">
  </span>
  <span class="grp"><button id="viewToggle">Scores table</button></span>
  <span id="keys" style="color:var(--muted)"><kbd>1</kbd>-<kbd>4</kbd> engines &nbsp;<kbd>&uarr;</kbd><kbd>&darr;</kbd> cases &nbsp;<kbd>r</kbd> random &nbsp;<kbd>s</kbd> side panel &nbsp;<kbd>o</kbd> overlay &nbsp;<kbd>m</kbd> more pages &nbsp;<kbd>t</kbd> scores table</span>
</div>
<div id="legend"></div>
<div id="side"><div id="sidehead"><input id="filter" placeholder="filter cases (name, group)…"><div id="fx">
  <label for="fxGroup">group</label><select id="fxGroup"><option value="">all groups</option></select>
  <label for="fxPages">pages</label><select id="fxPages"><option value="">any</option><option value="1-1">1</option><option value="2-3">2–3</option><option value="4-10">4–10</option><option value="11-">11+</option></select>
  <label for="fxEng">score</label><span class="row"><select id="fxEng"></select><select id="fxMetric"></select> ≤ <input type="number" id="fxMax" min="0" max="100" step="1" placeholder="any"></span>
  <label for="fxDiffer">pages</label><span class="row"><label><input type="checkbox" id="fxDiffer"> differ from Word</label></span>
  <span class="foot"><span id="fxn"></span><button id="fxRand" title="open a random case of this list (r)">random</button><button id="fxClear" title="clear every filter">clear</button></span>
</div></div><div id="list"></div></div>
<div id="main"><div id="grid"></div><div id="overlay" class="hidden"></div><button id="more" class="hidden">more pages</button><div id="scores" class="hidden"></div></div>

function pickRandom() {
  const vis = visibleCases();
  if (vis.length) state.sel = vis[Math.floor(Math.random() * vis.length)][1];
  state.view = 'viewer'; state.shown = PAGE_STEP;
}
function fxChanged() {
  const vis = visibleCases().map(([, i]) => i);
  if (vis.length && !vis.includes(state.sel)) { state.sel = vis[0]; state.shown = PAGE_STEP; }
  render(); showSel();
}
function setupFx() {
  const fx = state.fx, groups = [...new Set(DATA.map(c => c.group))].sort();
  for (const g of groups) { const o = document.createElement('option'); o.value = g; o.textContent = g; $('#fxGroup').appendChild(o); }
  for (const [k, label] of ENGINES) if (k !== 'reference') { const o = document.createElement('option'); o.value = k; o.textContent = label; $('#fxEng').appendChild(o); }
  for (const m of METRICS) { const o = document.createElement('option'); o.value = m; o.textContent = METRIC_LABEL[m]; o.title = METRIC_INFO[m]; $('#fxMetric').appendChild(o); }
  if (!groups.includes(fx.group)) fx.group = '';
  if (!ENGINES.some(([k]) => k === fx.eng && k !== 'reference')) fx.eng = ENGINES.find(([k]) => k !== 'reference')?.[0] ?? '';
  if (!METRICS.includes(fx.metric)) fx.metric = METRICS[0];
  // Filters saved by an earlier visit that hide every case would open on an empty page.
  if (!visibleCases().length) { Object.assign(fx, { group: '', pages: '', max: '', differ: false }); state.filter = ''; $('#filter').value = ''; }
  if (!DATA[state.sel]) state.sel = 0;
  $('#fxGroup').value = fx.group; $('#fxPages').value = fx.pages; $('#fxEng').value = fx.eng;
  $('#fxMetric').value = fx.metric; $('#fxMax').value = fx.max; $('#fxDiffer').checked = fx.differ;
  $('#fxGroup').onchange = e => { fx.group = e.target.value; fxChanged(); };
  $('#fxPages').onchange = e => { fx.pages = e.target.value; fxChanged(); };
  $('#fxEng').onchange = e => { fx.eng = e.target.value; fxChanged(); };
  $('#fxMetric').onchange = e => { fx.metric = e.target.value; fxChanged(); };
  $('#fxMax').oninput = e => { fx.max = e.target.value; fxChanged(); };
  $('#fxDiffer').onchange = e => { fx.differ = e.target.checked; fxChanged(); };
  $('#fxRand').onclick = () => { pickRandom(); render(); showSel(); };
  $('#fxClear').onclick = () => {
    Object.assign(fx, { group: '', pages: '', max: '', differ: false }); state.filter = '';
    $('#filter').value = ''; $('#fxGroup').value = ''; $('#fxPages').value = ''; $('#fxMax').value = ''; $('#fxDiffer').checked = false;
    fxChanged();
  };
  $('#mode').onchange = e => { location.href = e.target.value; };
  $('#navPrev').onclick = () => step(-1);
  $('#navNext').onclick = () => step(1);
  $('#navRand').onclick = $('#fxRand').onclick;
  $('#sideToggle').onclick = toggleSide;
  // The versions stay readable in each page column's header; in the bar they are tooltips.
  document.querySelectorAll('#engines label').forEach(l => { const v = l.querySelector('.ver'); if (v) l.title = v.textContent; });
}
// Prev / next through the filtered list, wrapping at both ends.
function step(d) {
  const vis = visibleCases().map(([, i]) => i); if (!vis.length) return;
  const at = vis.indexOf(state.sel);
  state.sel = at < 0 ? vis[0] : vis[(at + d + vis.length) % vis.length];
  state.view = 'viewer'; state.shown = PAGE_STEP; render(); showSel();
}
function toggleSide() { state.noside = !state.noside; render(); showSel(); }
// The legend's spans become an accordion: link-only spans stay visible as pills, every
// other span (and the keyboard hints) is one fold, all of it closed by default.
function accordionLegend() {
  const lg = $('#legend'), colors = ['#4ea1ff', '#c586c0', '#4ec9b0', '#dcdcaa', '#ce9178', '#9cdcfe', '#b5cea8', '#f48771'];
  const esc = t => t.replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const links = [], items = [];
  for (const sp of [...lg.children]) {
    const a = sp.querySelector('a');
    if (a && sp.textContent.trim() === a.textContent.trim()) { links.push(a.outerHTML); continue; }
    const b = sp.firstElementChild?.tagName === 'B' && sp.innerHTML.startsWith('<b>') ? sp.firstElementChild : null;
    let title = 'How the scores work', body = sp.innerHTML, sub = '';
    if (b) { title = b.textContent; b.remove(); body = sp.innerHTML.replace(/^\s*:\s*/, ''); }
    if (b && title.length <= 5) sub = sp.textContent.trim().split(/[:.,;]/)[0];  // metric: J, SSIM, TB, s
    items.push([title, sub, body]);
  }
  const keys = $('#keys'); if (keys) { items.push(['Keyboard', '', keys.innerHTML]); keys.remove(); }
  lg.innerHTML = `<details class="about"${state.about ? ' open' : ''}><summary><span class="chev">&#9656;</span>`
    + `<span class="ttl">About these scores</span><span class="hint">${items.length} notes</span>${links.join('')}</summary>`
    + `<div class="items">${items.map(([t, sub, body], i) => `<details class="item"><summary><span class="chev">&#9656;</span>`
      + `<span class="dot" style="background:${colors[i % colors.length]}"></span><b>${t}</b>${sub ? `<span class="sub">${esc(sub)}</span>` : ''}</summary>`
      + `<div>${body}</div></details>`).join('')}</div></details>`;
  const about = lg.querySelector('.about');
  about.ontoggle = () => { state.about = about.open; save('state', state); showSel(); };
}
function fmt(v) { return v == null ? '–' : v.toFixed(1) + '%'; }
function fmtM(m, v) { return m === 'time' ? (v == null ? '–' : v.toFixed(2) + ' s') : fmt(v); }
function val(c, k, m) { return (m === 'time' ? c.times?.[k] : c.scores[k]?.[m]) ?? null; }

function renderList() {
  const list = $('#list'); list.innerHTML = '';
  const shownCases = visibleCases(), at = shownCases.findIndex(([, i]) => i === state.sel);
  $('#fxn').textContent = `${shownCases.length} of ${DATA.length} cases`;
  $('#navPos').textContent = `${at < 0 ? '–' : at + 1} / ${shownCases.length}`;
  document.body.classList.toggle('noside', !!state.noside);
  for (const [c,i] of visibleCases()) {
    const d = document.createElement('div');
    d.className = 'case' + (i === state.sel ? ' sel' : '');
    d.innerHTML = `<span class="name" title="${c.case}">${c.case}</span><span class="grp">${c.group}</span>`;
    d.onclick = () => { state.sel = i; state.shown = PAGE_STEP; state.view = 'viewer'; render(); };
    list.appendChild(d);
  }
}

function renderScores() {
  const engines = ENGINES.filter(([k]) => k !== 'reference');
  // Sort columns: 0 case (manifest order), 1 group, 2 reference pages, then one per engine×metric.
  const cols = [
    { get: r => r.i, show: r => r.c.case },
    { get: r => r.c.group, show: r => r.c.group },
    { get: r => (r.c.page_counts || {}).reference ?? (r.c.pages.reference || []).length, show: r => (r.c.page_counts || {}).reference ?? (r.c.pages.reference || []).length, num: true },
  ];
  for (const [k] of engines) for (const m of TABLE_COLS)
    cols.push({ k, m, num: true, get: r => val(r.c, k, m), show: r => fmtM(m, val(r.c, k, m)) });

  const rows = visibleCases().map(([c, i]) => ({ c, i }));
  const { col: sc, dir } = state.sort; const sortCol = cols[sc] || cols[0];
  rows.sort((a, b) => {
    const x = sortCol.get(a), y = sortCol.get(b);
    if (x == null) return 1; if (y == null) return -1;
    return dir * (typeof x === 'string' ? x.localeCompare(y) : x - y);
  });
  const mean = cl => { const v = rows.map(cl.get).filter(x => typeof x === 'number'); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
  const th = (j, label, cls = '') => `<th data-c="${j}" class="${cls}${j === sc ? ' sorted' : ''}">${label}${j === sc ? (dir > 0 ? ' ▲' : ' ▼') : ''}</th>`;

  let html = `<div class="note">${rows.length} cases · click a column to sort, a row to open it · green = best engine for that column (highest score, lowest time)</div><table><thead>`;
  html += `<tr>${th(0, 'case')}${th(1, 'group')}${th(2, 'pages', 'num')}` +
    engines.map(([, label]) => `<th class="eng" colspan="${TABLE_COLS.length}">${label}${VERSIONS[engines.find(e => e[1] === label)[0]] ? ` <span class="ver">${VERSIONS[engines.find(e => e[1] === label)[0]]}</span>` : ''}</th>`).join('') + '</tr>';
  html += '<tr><th></th><th></th><th></th>' + cols.slice(3).map((cl, j) => th(j + 3, `<span title="${METRIC_INFO[cl.m]}">${METRIC_LABEL[cl.m]}</span>`, 'num' + (cl.m === METRICS[0] ? ' first' : ''))).join('') + '</tr>';
  html += '<tr class="mean"><td>mean</td><td></td><td></td>' + cols.slice(3).map(cl => `<td class="num${cl.m === METRICS[0] ? ' first' : ''}">${fmtM(cl.m, mean(cl))}</td>`).join('') + '</tr></thead><tbody>';
  for (const r of rows) {
    // Highest score (lowest time) per column across engines; ties all count as best.
    const best = {};
    for (const m of TABLE_COLS) { const v = engines.map(([k]) => val(r.c, k, m)).filter(x => x != null); best[m] = m === 'time' ? Math.min(...v) : Math.max(...v); }
    html += `<tr data-i="${r.i}"${r.i === state.sel ? ' class="sel"' : ''}>` + cols.map((cl, j) =>
      `<td class="${cl.num ? 'num' : ''}${j >= 3 && cl.m === METRICS[0] ? ' first' : ''}${j >= 3 && cl.get(r) != null && cl.get(r) === best[cl.m] ? ' best' : ''}">${cl.show(r)}</td>`).join('') + '</tr>';
  }
  const el = $('#scores'); el.innerHTML = html + '</tbody></table>';
  el.querySelectorAll('th[data-c]').forEach(h => h.onclick = () => {
    const j = +h.dataset.c; state.sort = { col: j, dir: j === state.sort.col ? -state.sort.dir : (j >= 3 ? -1 : 1) }; render();
  });
  el.querySelectorAll('tbody tr').forEach(tr => tr.onclick = () => { state.sel = +tr.dataset.i; state.shown = PAGE_STEP; state.view = 'viewer'; render(); });
}

function render() {
  save('state', state);
  document.querySelectorAll('#engines input').forEach(cb => cb.checked = !!state.on[cb.dataset.e]);
  $('#zoom').value = state.zoom; $('#ovl').checked = state.ovl;
  $('#ovlA').value = state.ovlA; $('#ovlB').value = state.ovlB; $('#blend').value = state.blend; $('#alpha').value = state.alpha;
  renderList();
  const c = DATA[state.sel]; if (!c) return;
  const table = state.view === 'scores';
  $('#viewToggle').textContent = table ? 'Viewer' : 'Scores table';
  history.replaceState(null, '', '#' + (table ? 'scores' : c.group + '/' + c.case));
  $('#scores').classList.toggle('hidden', !table);
  if (table) {
    for (const id of ['#grid', '#overlay', '#more']) $(id).classList.add('hidden');
    $('#pageinfo').textContent = '';
    renderScores();
    return;
  }
  const maxPages = Math.max(1, ...Object.values(c.pages).map(p => p.length));
  state.shown = Math.min(Math.max(PAGE_STEP, state.shown), maxPages);
  const pageIdx = [...Array(state.shown).keys()];
  const left = maxPages - state.shown;
  $('#pageinfo').textContent = `pages 1–${state.shown} of ${maxPages}`;
  $('#more').classList.toggle('hidden', left <= 0);
  $('#more').textContent = `more pages (${left} left)`;

  const grid = $('#grid'), ov = $('#overlay');
  grid.classList.toggle('hidden', state.ovl); ov.classList.toggle('hidden', !state.ovl);
  if (state.ovl) {
    ov.style.width = state.zoom + 'px'; ov.innerHTML = '';
    for (const p of pageIdx) {
      const wrap = document.createElement('div'); wrap.style.position = 'relative'; wrap.style.marginBottom = '8px';
      const a = (c.pages[state.ovlA]||[])[p], b = (c.pages[state.ovlB]||[])[p];
      wrap.innerHTML = (a ? `<img src="${a}">` : '<div class="missing">no page</div>') +
        (b ? `<img class="top" src="${b}" style="opacity:${state.alpha/100};mix-blend-mode:${state.blend}">` : '');
      ov.appendChild(wrap);
    }
    return;
  }
  const on = ENGINES.filter(([k]) => state.on[k]);
  grid.style.gridTemplateColumns = `repeat(${on.length}, ${state.zoom}px)`;
  grid.innerHTML = '';
  // Headers occupy their own grid row so a header that wraps to two lines in one column
  // does not push that column's pages down relative to the others.
  const cols = [];
  for (const [key,label] of on) {
    const s = c.scores[key] || {}; const shown = (c.pages[key]||[]).length; const n = (c.page_counts || {})[key] ?? shown;
    const sc = METRICS.filter(m => s[m] != null).map(m => ` · <span title="${METRIC_INFO[m]}">${METRIC_LABEL[m]} ${fmt(s[m])}</span>`).join('');
    // Reference PDFs printed via macOS (Producer "Quartz PDFContext") differ from Word's own export; flag them.
    const odd = key === 'reference' && c.reference_app && c.reference_app !== 'Microsoft Word' ? ` (${c.reference_app})` : '';
    const ver = (VERSIONS[key] || '') + odd;
    const h = document.createElement('h3'); h.className = 'colhead';
    h.innerHTML = `<b>${label}</b>${ver ? ` <span class="ver">${ver}</span>` : ''} · ${n} p${n > shown ? ` (first ${shown} shown)` : ''}${sc}`;
    grid.appendChild(h);
    const col = document.createElement('div'); col.className = 'col';
    for (const p of pageIdx) {
      const src = (c.pages[key]||[])[p];
      const d = document.createElement('div'); d.className = 'page';
      d.innerHTML = src ? `<img src="${src}" loading="lazy">` : `<div class="missing">no page ${p+1}</div>`;
      col.appendChild(d);
    }
    cols.push(col);
  }
  cols.forEach(col => grid.appendChild(col));
}

$('#more').onclick = () => { state.shown += PAGE_STEP; render(); };
$('#viewToggle').onclick = () => { state.view = state.view === 'scores' ? 'viewer' : 'scores'; render(); };
$('#zoom').oninput = e => { state.zoom = +e.target.value; render(); };
$('#ovl').onchange = e => { state.ovl = e.target.checked; render(); };
$('#ovlA').onchange = e => { state.ovlA = e.target.value; render(); };
$('#ovlB').onchange = e => { state.ovlB = e.target.value; render(); };
$('#blend').onchange = e => { state.blend = e.target.value; render(); };
$('#alpha').oninput = e => { state.alpha = +e.target.value; render(); };
$('#legend').innerHTML = '<span>All scores are against the Word reference, averaged over the pages both PDFs have; extra pages are ignored.</span><span><b>What this is</b>: redlines by jubarte, docxodus and SuperDoc against Microsoft Word&#8217;s own compare, every PDF rendered by Word for Mac, scored with docxide-pdf&#8217;s page-metrics at 150 DPI over every page. <b>redlines</b>: the tool&#8217;s compare of a corpus pair vs Word&#8217;s compare of it. <b>accepted</b>: the same redlines with every tracked change accepted by Word, vs Word&#8217;s compare accepted the same way. Shown: a seeded sample, half of it from pairs all three tools produced; first 3 pages at 100 DPI. Bench scores over every pair (1164 redline pairs, 100 accepted, 100 rejected): redlines: jubarte 1163/1164, mean 67.8, median 70.0, 183 at 90+; docxodus 1065/1164, mean 69.2, median 75.8, 168 at 90+; SuperDoc 94/1164, mean 60.3, median 60.4, 1 at 90+. accepted: jubarte 99/100, mean 78.0, median 88.2, 47 at 90+; docxodus 91/100, mean 84.1, median 99.6, 57 at 90+; SuperDoc 5/5, mean 96.3, median 97.6, 4 at 90+. rejected (every change rejected by Word, vs Word&#8217;s compare rejected the same way): jubarte 100/100, mean 64.6, median 58.3, 38 at 90+; docxodus 96/100, mean 73.2, median 78.2, 43 at 90+; SuperDoc 8/8, mean 97.6, median 98.4, 8 at 90+. SuperDoc (latest SDK) refuses most pairs, so its column is often empty. Scores: _build/redlines/.</span>' +
  TABLE_COLS.map(m => `<span><b>${METRIC_LABEL[m]}</b> ${METRIC_INFO[m]}</span>`).join('');
accordionLegend();
$('#filter').value = state.filter;
$('#filter').oninput = e => { state.filter = e.target.value; renderList(); };
setupFx();
if (!linked) pickRandom();
document.onkeydown = e => {
  if (e.target.tagName === 'SELECT' || (e.target.tagName === 'INPUT' && ['text', 'number'].includes(e.target.type))) return;
  const vis = visibleCases().map(([,i]) => i); const at = vis.indexOf(state.sel);
  if (e.key === 'ArrowDown') { state.sel = vis[Math.min(at+1, vis.length-1)] ?? state.sel; state.shown = PAGE_STEP; }
  else if (e.key === 'ArrowUp') { state.sel = vis[Math.max(at-1, 0)] ?? state.sel; state.shown = PAGE_STEP; }
  else if (e.key === 'r') pickRandom();
  else if (e.key === 's') state.noside = !state.noside;
  else if (e.key === 'o') state.ovl = !state.ovl;
  else if (e.key === 'm') state.shown += PAGE_STEP;
  else if (e.key === 't') state.view = state.view === 'scores' ? 'viewer' : 'scores';
  else if (/^[1-9]$/.test(e.key) && ENGINES[+e.key-1]) { const k = ENGINES[+e.key-1][0]; state.on[k] = !state.on[k]; }
  else return;
  e.preventDefault(); render();
  document.querySelector('#side .sel')?.scrollIntoView({block:'nearest'});
};
render();
showSel();
</script>
