<!doctype html>
<meta charset="utf-8">
<title>Redlines vs Microsoft Word: jubarte, docxodus, SuperDoc</title>
<style>
:root { --bg:#1e1e1e; --panel:#252526; --fg:#ddd; --muted:#888; --accent:#4ea1ff; --border:#3a3a3a; }
* { box-sizing:border-box; }
body { margin:0; font:13px/1.4 -apple-system, Helvetica, Arial, sans-serif; background:var(--bg); color:var(--fg); display:grid; grid-template-columns:280px 1fr; grid-template-rows:auto auto 1fr; height:100vh; }
#legend { grid-column:1/3; padding:3px 10px 5px; font-size:11px; line-height:1.5; color:var(--muted); background:var(--panel); border-bottom:1px solid var(--border); }
#legend b { color:var(--fg); }
#legend span { margin-right:14px; }
#bar { grid-column:1/3; display:flex; gap:14px; align-items:center; padding:6px 10px; background:var(--panel); border-bottom:1px solid var(--border); flex-wrap:wrap; }
#bar label { display:inline-flex; align-items:center; gap:4px; cursor:pointer; user-select:none; }
#bar .grp { display:inline-flex; gap:8px; align-items:center; padding-right:14px; border-right:1px solid var(--border); }
#bar button, #bar select, #bar input[type=text] { background:#333; color:var(--fg); border:1px solid #555; border-radius:3px; padding:2px 8px; font:inherit; }
#bar button:hover { background:#444; }
kbd { background:#333; border:1px solid #555; border-radius:3px; padding:0 4px; font-size:11px; color:var(--muted); }
.ver { color:var(--muted); font-weight:400; font-size:11px; }
#side { overflow:auto; background:var(--panel); border-right:1px solid var(--border); }
#side input { width:100%; padding:6px 8px; background:#333; color:var(--fg); border:0; border-bottom:1px solid var(--border); font:inherit; position:sticky; top:0; }
#side .case { padding:4px 8px; cursor:pointer; border-bottom:1px solid #2e2e2e; display:grid; grid-template-columns:1fr auto; gap:0 8px; align-items:baseline; }
#side .case:hover { background:#2c2c2c; }
#side .case.sel { background:#094771; }
#side .name { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#side .grp { color:var(--muted); font-size:11px; }
#main { overflow:auto; padding:10px; }
#grid { display:grid; gap:4px 10px; align-items:start; }
.col { min-width:0; }
.colhead { margin:0; min-width:0; font-size:12px; font-weight:600; color:var(--muted); position:sticky; top:0; background:var(--bg); padding:2px 0; z-index:1; }
.colhead b { color:var(--fg); }
.page { margin-bottom:8px; }
.page img { width:100%; display:block; background:#fff; box-shadow:0 0 0 1px #000; }
.missing { width:100%; aspect-ratio:8.5/11; display:flex; align-items:center; justify-content:center; color:var(--muted); background:#2a2a2a; border:1px dashed #444; }
#overlay { position:relative; }
#overlay img { width:100%; display:block; }
#overlay img.top { position:absolute; inset:0; }
#scores table { border-collapse:collapse; font-size:12px; white-space:nowrap; }
#scores th, #scores td { padding:3px 9px; border-bottom:1px solid #2e2e2e; text-align:left; }
#scores th { color:var(--muted); font-weight:600; cursor:pointer; user-select:none; background:var(--panel); }
#scores th.eng { text-align:center; border-left:1px solid var(--border); cursor:default; }
#scores th.sorted { color:var(--fg); }
#scores td.num, #scores th.num { text-align:right; font-variant-numeric:tabular-nums; }
#scores td.first { border-left:1px solid var(--border); }
#scores td.best { color:#7ee787; }
#scores tr.mean td { color:var(--fg); font-weight:600; background:#2a2a2a; }
#scores tbody tr { cursor:pointer; }
#scores tbody tr:hover { background:#2c2c2c; }
#scores tbody tr.sel { background:#094771; }
#scores .note { color:var(--muted); font-size:11px; margin:8px 0 14px; }
.hidden { display:none !important; }
#more { display:block; margin:4px 0 24px; padding:8px 18px; background:#333; color:var(--fg); border:1px solid #555; border-radius:4px; font:inherit; cursor:pointer; }
#more:hover { background:#444; }
/* viewer-features v2 */
#bar select#mode { font-weight:600; }
#sidehead { position:sticky; top:0; z-index:2; background:var(--panel); border-bottom:1px solid var(--border); }
#sidehead #filter { position:static; }
#fx { display:grid; grid-template-columns:auto minmax(0, 1fr); gap:4px 6px; padding:6px 8px; font-size:12px; align-items:center; }
#fx label { color:var(--muted); }
#fx select, #fx input, #fx button { background:#333; color:var(--fg); border:1px solid #555; border-radius:3px; padding:1px 4px; font:inherit; width:auto; position:static; }
#fx .row { display:flex; gap:4px; align-items:center; flex-wrap:wrap; min-width:0; }
#fx select { max-width:100%; min-width:0; }
#fx input[type=number] { width:4.5em; }
#fx .foot { grid-column:1/3; display:flex; gap:6px; align-items:center; flex-wrap:wrap; padding-right:4px; }
#fx .foot #fxn { color:var(--muted); margin-right:auto; }
#fx button:hover { background:#444; }
#list .case { scroll-margin-top:var(--headh, 0px); }
body.noside { grid-template-columns:0 1fr; }
body.noside #side { display:none; }
body.noside #main { grid-column:1/3; }
#nav { gap:4px; }
#nav #navPos { color:var(--muted); font-size:11px; min-width:6.5em; text-align:center; font-variant-numeric:tabular-nums; }
#sideToggle { font-size:14px; line-height:1; padding:2px 7px; }
body.noside #sideToggle { background:#094771; border-color:var(--accent); }
#engines .ver { display:none; }
#legend { padding:0; }
#legend summary { list-style:none; cursor:pointer; user-select:none; }
#legend summary::-webkit-details-marker { display:none; }
#legend .chev { display:inline-block; transition:transform .18s ease; color:var(--accent); }
#legend details[open] > summary .chev { transform:rotate(90deg); }
#legend .about > summary { display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; padding:3px 10px; }
#legend .about > summary .ttl { color:var(--fg); font-weight:600; }
#legend .about > summary .hint { color:var(--muted); }
#legend .about > summary a, #legend .pill { display:inline-block; padding:0 9px; border:1px solid var(--border); border-radius:999px; background:#2d2d30; color:var(--accent); text-decoration:none; }
#legend .about > summary a:hover { background:#34343a; }
#legend .items { display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); gap:6px; padding:2px 10px 8px; align-items:start; }
#legend .item { border:1px solid var(--border); border-radius:10px; background:#2a2a2d; overflow:hidden; }
#legend .item > summary { padding:4px 10px; color:var(--fg); display:flex; gap:7px; align-items:baseline; }
#legend .item > summary:hover { background:#313136; }
#legend .item > summary .dot { width:8px; height:8px; border-radius:50%; flex:none; align-self:center; }
#legend .item > summary .sub { color:var(--muted); font-weight:400; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#legend .item > div { padding:2px 12px 8px 25px; color:#bbb; }
/* jubarte-theme v1 */
@font-face { font-family:"Manrope"; font-style:normal; font-weight:200 800; font-display:swap; src:url("_static/fonts/manrope-latin-wght-normal.woff2") format("woff2-variations"); }
@font-face { font-family:"JetBrains Mono"; font-style:normal; font-weight:100 800; font-display:swap; src:url("_static/fonts/jetbrains-mono-latin-wght-normal.woff2") format("woff2-variations"); }

:root {
  --ink:#0b1e2d; --muted:#5a7183; --line:#dce6ec; --paper:#f4f8fb; --white:#fff; --blue:#1e5580;
  --blue-d:#123b5c; --navy:#061c30; --sky:#e9f3f7; --hover:#eef4f8; --steel:#b4c4cf; --off:#8fa6b6;
  --forest:#1c5f46; --brick:#8a3b2e;
  --sans:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --bg:var(--paper); --panel:var(--white); --fg:var(--ink); --accent:var(--blue); --border:var(--line);
}
body { font-family:var(--sans); -webkit-font-smoothing:antialiased; }
a { color:var(--blue); }
a:hover { color:var(--blue-d); }
#brand { grid-column:1/3; display:flex; align-items:center; gap:14px; padding:10px 14px; background:var(--white); border-bottom:1px solid var(--line); flex-wrap:wrap; }
#brand .logo { display:inline-flex; align-items:center; gap:10px; color:var(--ink); text-decoration:none; font-family:var(--mono); font-size:13px; font-weight:600; letter-spacing:.14em; }
#brand .crumb { font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
#brand .links { margin-left:auto; display:flex; gap:16px; font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; }
#brand .links a { text-decoration:none; }

body { font-size:13px; grid-template-rows:auto auto auto 1fr; }
#bar { background:var(--paper); border-bottom:1px solid var(--line); gap:10px 14px; padding:8px 14px; }

#bar button, #bar select, #bar input[type=text], #fx select, #fx input, #fx button, #more {
  background:var(--white); color:var(--ink); border:1px solid var(--line); border-radius:0; font-family:var(--mono);
  font-size:11px; letter-spacing:.06em; padding:5px 10px; }
#bar button, #fx button, #more { text-transform:uppercase; letter-spacing:.08em; cursor:pointer; }
#bar button:hover, #fx button:hover, #more:hover { background:var(--hover); }
#bar select#mode { background:var(--navy); color:var(--white); border-color:var(--navy); font-family:var(--sans); font-size:13px; font-weight:600; letter-spacing:0; padding:6px 10px; }
#navRand { background:var(--navy) !important; color:var(--white) !important; border-color:var(--navy) !important; }
body.noside #sideToggle { background:var(--sky); color:var(--blue-d); border-color:var(--line); }
#nav #navPos, #pageinfo { font-family:var(--mono); font-size:11px; color:var(--muted); }
#bar label { font-family:var(--mono); font-size:11px; letter-spacing:.04em; }
input[type=range], input[type=checkbox] { accent-color:var(--blue); }
kbd { background:var(--white); border:1px solid var(--line); border-radius:0; color:var(--muted); font-family:var(--mono); }
#side { background:var(--white); border-right:1px solid var(--line); }
#side input#filter { background:var(--white); color:var(--ink); border-bottom:1px solid var(--line); font-family:var(--sans); padding:9px 10px; }
#sidehead { background:var(--white); border-bottom:1px solid var(--line); }

#fx input[type=number] { width:5.5em; }
#fx label { font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; }
#fx .foot #fxn { font-family:var(--mono); font-size:11px; }
#side .case { border-bottom:1px solid var(--line); padding:6px 10px; }
#side .case:hover { background:var(--hover); }
#side .case.sel { background:var(--navy); color:var(--white); }
#side .case.sel .grp { color:var(--steel); }
#side .name { font-family:var(--mono); font-size:12px; }

#main { background:var(--paper); padding:14px; }
.colhead { background:var(--paper); font-family:var(--mono); font-size:11px; letter-spacing:.06em; color:var(--muted); padding:4px 0 6px; }
.colhead b { color:var(--ink); text-transform:uppercase; letter-spacing:.08em; }
.page img { box-shadow:0 0 0 1px var(--line); }

#scores td.best { color:var(--forest); font-weight:600; }

#scores tbody tr:hover { background:var(--hover); }
#scores tbody tr.sel { background:var(--sky); box-shadow:inset 3px 0 0 var(--navy); }
#legend { background:var(--white); border-bottom:1px solid var(--line); }
#legend .chev { color:var(--blue); }
#legend .about > summary { padding:6px 14px; }

#legend .about > summary a, #legend .pill { border-radius:0; background:var(--white); border-color:var(--line); color:var(--blue); font-family:var(--mono); font-size:11px; padding:2px 10px; }
#legend .about > summary a:hover { background:var(--hover); }
#legend .item { border-radius:0; background:var(--white); border-color:var(--line); }

#legend .item > div { color:var(--muted); }

$('#legend').innerHTML = '<span>All scores are against the Word reference, averaged over the pages both PDFs have; extra pages are ignored.</span><span><b>What this is</b>: redlines by jubarte (0.11.2 and the 0.9.3 release), docxodus and SuperDoc against Microsoft Word&#8217;s own compare, every PDF rendered by Word for Mac, scored with docxide-pdf&#8217;s page-metrics at 150 DPI over every page. <b>redlines</b>: the tool&#8217;s compare of a corpus pair vs Word&#8217;s compare of it. <b>accepted</b>: the same redlines with every tracked change accepted by Word, vs Word&#8217;s compare accepted the same way. Shown: a seeded sample, half of it from pairs every tool produced; first 3 pages at 100 DPI. Bench scores over every pair (2611 redline pairs, 100 accepted, 100 rejected): redlines: jubarte 0.11.2 3501/3502, mean 74.9, median 84.3, 427 at 90+; jubarte 0.9.3 3338/3502, mean 72.0, median 81.3, 634 at 90+; docxodus 2612/3502, mean 72.3, median 81.7, 482 at 90+; SuperDoc 380/3502, mean 61.4, median 61.1, 7 at 90+. accepted: jubarte 0.11.2 99/100, mean 92.9, median 99.7, 76 at 90+; jubarte 0.9.3 99/100, mean 78.6, median 88.8, 49 at 90+; docxodus 91/100, mean 83.8, median 98.7, 55 at 90+; SuperDoc 5/5, mean 96.3, median 97.6, 4 at 90+. rejected (every change rejected by Word, vs Word&#8217;s compare rejected the same way): jubarte 0.11.2 100/100, mean 81.3, median 94.6, 55 at 90+; jubarte 0.9.3 100/100, mean 64.2, median 58.3, 36 at 90+; docxodus 96/100, mean 72.5, median 77.2, 40 at 90+; SuperDoc 8/8, mean 97.8, median 98.6, 8 at 90+. SuperDoc (latest SDK) refuses most pairs, so its column is often empty. Scores: _build/redlines/.</span><span><b>jubarte 0.11.2</b>: the release lane over every pair of this run (redlines, Word&#8217;s PDF of each, accept-all and reject-all of the shown pairs as for every tool); the bench-wide scores above are this same lane. Word&#8217;s per-session author colour moves the at-90+ count and part of the mean (NOTES_0112_full.md with the paired 0.10.1 comparison, in _build/redlines/); on the colour-free terms (ink Jaccard, text boundary) 0.11.2 is the better of the two.</span>' +
  TABLE_COLS.map(m => `<span><b>${METRIC_LABEL[m]}</b> ${METRIC_INFO[m]}</span>`).join('');
accordionLegend();
$('#filter').value = state.filter;
$('#filter').oninput = e => { state.filter = e.target.value; renderList(); };
setupFx();
if (!linked) pickRandom();
document.onkeydown = e => {
  if (e.target.tagName === 'SELECT' || (e.target.tagName === 'INPUT' && ['text', 'number'].includes(e.target.type))) return;
  const vis = visibleCases().map(([,i]) => i); const at = vis.indexOf(state.sel);
  if (e.key === 'ArrowDown') { state.sel = vis[Math.min(at+1, vis.length-1)] ?? state.sel; state.shown = PAGE_STEP; }
  else if (e.key === 'ArrowUp') { state.sel = vis[Math.max(at-1, 0)] ?? state.sel; state.shown = PAGE_STEP; }
  else if (e.key === 'r') pickRandom();
  else if (e.key === 's') state.noside = !state.noside;
  else if (e.key === 'o') state.ovl = !state.ovl;
  else if (e.key === 'm') state.shown += PAGE_STEP;
  else if (e.key === 't') state.view = state.view === 'scores' ? 'viewer' : 'scores';
  else if (/^[1-9]$/.test(e.key) && ENGINES[+e.key-1]) { const k = ENGINES[+e.key-1][0]; state.on[k] = !state.on[k]; }
  else return;
  e.preventDefault(); render();
  document.querySelector('#side .sel')?.scrollIntoView({block:'nearest'});
};
render();
showSel();
</script>
