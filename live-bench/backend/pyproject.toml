[project]
name = "jubarte-live-bench"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["neurotic-docx-bench>=0.7.0", "httpx>=0.28,<1", "python-docx==1.2.0", "docx-scalpel==0.6.5", "lxml>=6,<7", "redlines[nupunkt]==0.6.1", "nupunkt==0.6.0"]

[tool.uv.sources]
neurotic-docx-bench = { path = "../..", editable = true }

[project.scripts]
jubarte-live-bench = "livebench.service:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["livebench"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.14"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: real local filesystem or process"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
