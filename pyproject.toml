[project]
name = "neurotic-docx-bench"
version = "1.0.0"
license = "AGPL-3.0-only"
description = "A benchmark for manipulating docx files and assessing their fidelity to Microsoft Word(R), the oracle."
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Arthur Souza Rodrigues", email = "arthursrodrigues@gmail.com" }]
keywords = ["docx", "ooxml", "benchmark", "redline", "tracked-changes", "microsoft-word", "pdf"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Software Development :: Testing",
    "Topic :: Text Processing :: Markup :: XML",
    "Typing :: Typed",
]
dependencies = [
    "pymupdf>=1.24",
    "numpy>=2.0",
    "pillow>=10.0",
    "scipy>=1.13",
    # Upper-capped: the verbatim-lifted score.py uses morphology.binary_dilation (removed
    # in skimage 0.28) and remove_small_objects(min_size=…) (removed in 2.0). Pinning the
    # wheel's floor<ceiling keeps `pip install` consumers on a working API (uv.lock already
    # pins the exact resolved version for `uv sync`).
    "scikit-image>=0.24,<0.28",
    "typer>=0.12",
    "lxml>=6.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "docx-revisions>=0.1.5",
    "pydantic>=2.11",
    "huggingface-hub>=2.0",
    "polars>=1.44.2",
    "aiofiles>=25.1.0",
]

[project.optional-dependencies]
# Competitor SDKs driven by the generator modules (superdoc_gen, redlines_gen,
# playwright_speed). Scoring, reporting and `bench score` need none of them.
competitors = [
    "playwright>=1.61.0",
    "superdoc-sdk==2.16.0",
    # houfu/redlines — text redliner (JSON/Markdown/HTML). Extras: nupunkt (sentence
    # tokenization), levenshtein (distance stats). The `pdf` extra does not exist on
    # 0.6.1 (README documents it, PyPI does not ship it). nupunkt is also pinned
    # first-class so a dropped extra cannot silently fall back to WholeDocumentProcessor.
    "redlines[levenshtein,nupunkt]==0.6.1",
    "nupunkt==0.6.0",
]
# Torch backend for the scorer kernels (`--device mps|cuda`); the skimage path is the default.
gpu = ["torch>=2.5"]

[project.urls]
Homepage = "https://github.com/jandira-tech/neurotic_docx_bench"
Repository = "https://github.com/jandira-tech/neurotic_docx_bench"
Issues = "https://github.com/jandira-tech/neurotic_docx_bench/issues"
Changelog = "https://github.com/jandira-tech/neurotic_docx_bench/blob/main/CHANGELOG.md"
Fixtures = "https://huggingface.co/datasets/arthrod/neurotic_docx_bench-fixtures"

[project.scripts]
bench = "neurotic_docx_bench.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neurotic_docx_bench"]
# The vendored competitor tools (1.2 GB of sources and node_modules) never ship.
exclude = ["src/neurotic_docx_bench/utils/**", "**/__pycache__", "**/.DS_Store"]

[tool.hatch.build.targets.sdist]
# The package and what it needs to build; the corpus, results, scripts and harnesses stay in git.
only-include = ["src/neurotic_docx_bench", "licenses", "LICENSE", "README.md", "CHANGELOG.md", "CITATION.cff", "pyproject.toml"]
exclude = ["src/neurotic_docx_bench/utils/**", "**/__pycache__", "**/.DS_Store"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "ty>=0.0.56",
    # scripts/word_pdf.py and scripts/word_redline.py are standalone PEP 723
    # scripts (they declare their own deps for `uv run --script`), but
    # tests/test_word_pdf.py and tests/test_word_redline.py import them, so the
    # test environment needs what they import. typer and rich are already
    # project dependencies; loguru is not.
    "loguru>=0.7",
    "pytest-cov>=6.0",
    "aiohttp>=3.14.3",
    "numpy>=2.5.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -n 12"
markers = ["slow: builds the wheel or runs a long external process"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.rules]
# The scoring core (score.py, diff.py, raster.py, report.py, html_report.py) is a
# verbatim lift guarded by tests/test_parity.py; don't let type noise pressure edits there.
possibly-missing-attribute = "warn"
