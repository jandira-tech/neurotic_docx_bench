name: bench

# Manual only. The LibreOffice oracle (corpus/libreoffice) is LibreOffice 26.2.4.2's render of
# the Word corpus; a runner whose apt LibreOffice is another build scores against renders its own
# build did not make. Install 26.2.4.2 on the runner before putting this back on a schedule.
on:
  workflow_dispatch: {}

permissions:
  contents: write   # to commit results/bench.jsonl + snapshots on a real delta

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LibreOffice + fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-writer libreoffice-core fonts-liberation fonts-dejavu fonts-noto

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # pnpm/action-setup reads the pin from package.json's packageManager field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc   # Node 26
          cache: pnpm

      - name: Install deps
        run: |
          uv sync --frozen
          pnpm install --frozen-lockfile

      - name: Run bench (gate sets exit status)
        env:
          BENCH_CLEAN_RUNS: "1"
        run: uv run bench run --clean-runs

      - name: Speed benchmark (redline generation time)
        if: always()   # record speed even if the fidelity gate failed
        run: |
          TS="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          # Smaller sample than local (20×2) to keep CI quick; appends to the trend log.
          node --import tsx scripts/speed-bench.ts \
            --pairs 20 --reps 2 --warmup 3 --out results/speed.jsonl --run-ts "$TS"
          uv run python -m neurotic_docx_bench.superdoc_speed \
            --pairs 20 --reps 2 --warmup 3 --out results/speed.jsonl --run-ts "$TS"

      # D-2 accept/reject scoreboard. The contract tests run everywhere; the
      # full three-lens sweep needs sibling engine checkouts (jubarte-redlines
      # CLI, jubarte-first source, a folio checkout) and skips LOUDLY when they
      # are absent — on this ubuntu runner it currently always skips, so the
      # sweep runs on the local scheduled machine (see TODO.md). No silent cap:
      # the skip line names exactly what was missing.
      - name: D-2 scoreboard (contract tests + gated sweep)
        if: always()
        run: |
          pnpm exec vitest run scripts/redline_scoreboard.test.ts
          if [ -x src/neurotic_docx_bench/utils/jubarte/jubarte-redlines/target/release/jubarte ] \
             && [ -d src/neurotic_docx_bench/utils/jubarte/jubarte-first/src/lossless ] \
             && [ -f src/neurotic_docx_bench/utils/folio-checkout/packages/core/src/redline-lossless-verify.ts ]; then
            node --import tsx scripts/redline_scoreboard.ts --update-results
          else
            echo "D-2 sweep SKIPPED: engine/folio checkouts absent on this runner" \
                 "(needs the engine links under src/neurotic_docx_bench/utils: scripts/link_engines.sh)."
          fi

      - name: Regenerate the published views from the stores
        if: always()
        run: uv run bench report

      - name: Published views are current
        if: always()
        run: uv run bench report --check

      - name: Commit results on change
        if: always()
        run: |
          git config user.name  "bench-bot"
          git config user.email "bench@users.noreply.github.com"
          # Only the durable outputs, never runs/ intermediates.
          # Stage FIRST, then diff the index — plain `git diff` ignores brand-new
          # (untracked) files like results/score-snapshots/*.json, so a run that only
          # adds new snapshots would be silently dropped.
          git add results/
          if ! git diff --cached --quiet -- results/; then
            git commit -m "bench: update results [skip ci]"
            git push
          else
            echo "no results delta — nothing to commit"
          fi
