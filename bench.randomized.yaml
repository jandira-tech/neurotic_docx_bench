# Temporary config for the randomized consecutive-pair corpus
# (corpus/word_based/docx_source_randomized + pdf_redlines_randomized).
# Oracle PDFs: Word redlines rendered by LibreOffice via `bench render`.
source_of_truth: corpus/word_based/pdf_redlines_randomized/pdf
scoring:
  dpi: 144

runs:
  - name: jubarte-final-lossless
    dist: src/neurotic_docx_bench/utils/jubarte/dist/jubarte-final
    generate: >-
      node --import tsx scripts/generate-native-redlines.ts
      --method=jubarte-lossless
      --dist=src/neurotic_docx_bench/utils/jubarte/dist/jubarte-final
      --manifest=corpus/word_based/centralized_mapping_randomized.csv
      --source-dir=corpus/word_based/docx_source_randomized
      --out=$RUN_DIR/docx
      --run-dir=$RUN_DIR
      --tool=jubarte-final-lossless
      --force
    render: soffice
    jobs: 8
    vendor: jubarte
    benchmarks: [script_redlines]

  - name: jubarte-rust
    dist: src/neurotic_docx_bench/utils/jubarte/jubarte-rust
    generate: >-
      node --import tsx scripts/generate-native-redlines.ts
      --method=jubarte-rust
      --dist=src/neurotic_docx_bench/utils/jubarte/jubarte-rust
      --manifest=corpus/word_based/centralized_mapping_randomized.csv
      --source-dir=corpus/word_based/docx_source_randomized
      --out=$RUN_DIR/docx
      --run-dir=$RUN_DIR
      --tool=jubarte-rust
      --force
    render: soffice
    jobs: 8
    vendor: jubarte-rust
    benchmarks: [script_redlines]

  - name: docxodus
    package: "docxodus@7.0.0"
    generate: >-
      node --import tsx scripts/generate-native-redlines.ts
      --method=docxodus
      --manifest=corpus/word_based/centralized_mapping_randomized.csv
      --source-dir=corpus/word_based/docx_source_randomized
      --out=$RUN_DIR/docx
      --run-dir=$RUN_DIR
      --tool=docxodus
      --force
    render: soffice
    jobs: 8
    vendor: docxodus
    benchmarks: [script_redlines]
